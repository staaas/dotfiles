---
- name: ensure ~/projects exists
  file: path={{ ansible_facts["env"]["HOME"] }}/projects state=directory

- include_tasks: scm.yml

- name: Install container and image management packages
  pacman:
    state: installed
    package:
    - podman
    - skopeo
  become: true

- name: Install K8s packages
  pacman:
    state: installed
    package:
    - helm
    - k9s
    - kubectl
    - kubectx
  become: true

- name: Install json and yaml tools
  pacman:
    state: installed
    package:
    - jless
    - jq
    - go-yq
  become: true

- name: install perf
  pacman: package=perf state=installed
  become: true

- include_tasks: nix.yml

- include_tasks: python.yml

- include_tasks: rust.yml

- include_tasks: golang.yml

- include_tasks: k8s.yml
